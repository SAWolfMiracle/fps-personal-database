<h2>Arca · 邮箱验证</h2>
<p>你的验证码：</p>
<p style="font-size:28px;font-weight:bold;letter-spacing:4px">{{ .Token }}</p>
<p>请返回刚才发送邮件的应用，输入验证码完成登录或邮箱绑定。iPhone 主屏幕版请直接在主屏幕应用内输入。</p>
<p>验证码和链接只能使用一次，请使用最新邮件；不要把验证码提供给其他人。</p>
<p>也可以在浏览器中<a href="{{ .ConfirmationURL }}">通过链接验证</a>。这不会让已安装的主屏幕应用自动登录。</p>
<p>如果不是你发起的请求，请忽略这封邮件。</p>
